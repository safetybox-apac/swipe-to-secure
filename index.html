<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3e10c"><title>Swipe to Secure</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="swipe.css"><script src="audio.js" defer></script><script src="app.js" defer></script></head><body><header><div class="brand">AIRBUS <button id="settingsButton" class="icon" aria-label="Open sound settings">⚙</button></div><span>SWIPE TO SECURE · SPOT IT. ACT ON IT.</span></header><main id="app"></main><div id="toast" role="status"></div><div id="announcement" class="sr" role="status"></div><dialog id="settings" aria-labelledby="soundTitle"><div class="spread"><h2 id="soundTitle">Sound settings</h2><button id="closeSettings" class="icon" aria-label="Close settings">✕</button></div><label class="check"><input id="music" type="checkbox" checked> Background music</label><label class="check"><input id="effects" type="checkbox" checked> Sound effects</label></dialog><dialog id="zoom" aria-labelledby="zoomTitle"><div class="spread"><h2 id="zoomTitle">Inspect the scene</h2><button id="closeZoom" class="icon" aria-label="Close enlarged photo">✕</button></div><div id="zoomImage"></div><p class="hint">AI generated — for illustration purposes only.</p></dialog><dialog id="confirm"><h2>Finish this game?</h2><p>Your current decisions will be scored. Unanswered parts earn no points.</p><div class="actions"><button id="keepPlaying">Keep playing</button><button id="finishNow" class="primary">Finish game</button></div></dialog></body></html>
